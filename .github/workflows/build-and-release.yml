name: Build & Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Create a GitHub Release with compiled jar'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    name: Build Soulbound QoL
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Compile Dependencies
        id: cache-deps
        uses: actions/cache@v4
        with:
          path: .ci-libs
          key: ci-deps-mc1.21.1-turnbattle2.0.7-v1

      - name: Prepare Compile Dependencies
        run: |
          chmod +x scripts/setup_ci_deps.sh
          ./scripts/setup_ci_deps.sh

      - name: Compile and Package Mod
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Verify Build Output
        run: |
          if [ ! -f soulbound-qol-1.0.0.jar ]; then
            echo "Error: soulbound-qol-1.0.0.jar was not generated!" >&2
            exit 1
          fi
          echo "Build successful! Size: $(du -h soulbound-qol-1.0.0.jar | cut -f1)"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: soulbound-qol-1.0.0
          path: soulbound-qol-1.0.0.jar
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.create_release)
        uses: softprops/action-gh-release@v2
        with:
          files: soulbound-qol-1.0.0.jar
          name: Release ${{ github.ref_name }}
          generate_release_notes: true
          draft: false
          prerelease: false
